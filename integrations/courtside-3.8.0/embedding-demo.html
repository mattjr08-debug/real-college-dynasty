let finalResult=null;
window.addEventListener('message', event=>{
 const court=document.getElementById('court');
 if(event.source!==court?.contentWindow)return;
 if(event.data?.type==='college-dynasty-ready')court.contentWindow.postMessage({type:'college-dynasty-start',match:exampleMatch},'*');
 if(event.data?.type==='college-dynasty-error')document.getElementById('result').textContent=event.data.message;
 if(event.data?.type==='college-dynasty-final'){
  finalResult=event.data;
  document.getElementById('result').textContent=JSON.stringify(finalResult,null,2);
  document.getElementById('download').hidden=false;
 }
});
function downloadResult(){
 const url=URL.createObjectURL(new Blob([JSON.stringify(finalResult,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='basketball-final.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
